name: OmniPulse Live Satellite Radar Engine
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  radar-hack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Raw Intelligence and Inject to Supabase
        run: |
          NODE_CODE=$(cat << 'EOF'
          const supabaseUrl = "https://supabase.co";
          const apiKey = "sb_secret_arp0x-gbdVPIT0nMvTV_PQ_b27e_4qs";

          async function startRadar() {
            try {
              const fetch = (await import('node-fetch')).default;
              
              // 1. ከቀጥታ የዓለም ጥሬ የዜና ማስተላለፊያ መስመሮች (Raw Wire API) መረጃን መጥለፍ
              const res = await fetch("https://spaceflightnewsapi.net");
              const data = await res.json();
              if (!data.results || data.results.length === 0) return;
              
              const rawData = data.results[0];
              
              // 2. በራስ-ገዝ ወደ አማርኛ መተርጎም
              const transRes = await fetch(`https://googleapis.com{encodeURIComponent(rawData.title)}`);
              const transData = await transRes.json();
              const amharicTitle = transData[0][0][0];

              const descRes = await fetch(`https://googleapis.com{encodeURIComponent(rawData.summary || "No description")}`);
              const descData = await descRes.json();
              const amharicDesc = descData[0][0][0];

              // 3. ወደ Supabase መጋዘን መርጨት
              const payload = {
                title: amharicTitle,
                description: amharicDesc,
                source: "Sovereign Satellite Node",
                status: "Hacked Raw Data"
              };

              await fetch(supabaseUrl, {
                method: 'POST',
                headers: {
                  'apikey': apiKey,
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify(payload)
              });
              console.log("✓ Raw data successfully injected!");
            } catch (err) {
              console.error("Radar Error:", err);
            }
          }
          startRadar();
          EOF
          )
          node -e "$NODE_CODE"
